name: SpendWise CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spendwise_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: spendwise_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://spendwise_test:test_password@localhost:5432/spendwise_test_db
        run: |
          alembic upgrade head

      - name: Run Pytest test suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://spendwise_test:test_password@localhost:5432/spendwise_test_db
          SECRET_KEY: test_secret_key_for_ci_pipeline_spendwise
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Vitest unit tests
        working-directory: ./frontend
        run: |
          npm run test

      - name: Verify TypeScript & Production Build
        working-directory: ./frontend
        run: |
          npm run build
